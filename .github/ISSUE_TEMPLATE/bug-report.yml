name: Bug report
description: Something in Orchard doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. [Questions and problems](https://github.com/chaseleantj/orchard-photos/blob/main/docs/questions-and-problems.md) covers the common ones, so check there first.
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS, Apple Silicon
        - macOS, Intel
        - Windows, x64
        - Windows, Arm
        - Linux
        - WSL
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      placeholder: macOS 15.5, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orchard version
      description: The version at the bottom of Info. If you cloned the repository, also add the output of `git rev-parse --short HEAD`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step.
      placeholder: |
        1. Ran ./orchard ~/Pictures
        2. Typed "dog on a beach" in the search bar
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Info, click Copy diagnostics, and paste it here. It has no file names or folders.
      render: text
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: What the terminal printed. The Mac apps write it to `~/Library/Logs/Orchard.log`, and the Windows app to `%TEMP%\Orchard.log`.
      render: text
