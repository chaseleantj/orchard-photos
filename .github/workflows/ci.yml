name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual:
        description: Also download the search model (about 500 MB on macOS, 690 MB on Ubuntu) and test visual search
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      # ./orchard picks python3.13 over python3.12, so each runner gets the one it will actually use.
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            tests: npm test
          - os: macos-latest
            python: '3.13'
            tests: npm test
          - os: windows-latest
            python: '3.13'
            tests: .venv/Scripts/python -m unittest discover -s tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache the search model
        if: inputs.visual
        uses: actions/cache@v4
        with:
          path: ~/orchard-data/models
          key: search-model-${{ hashFiles('server/semantic.py') }}
      # Installs through the launcher like a first run, so the unit tests below reuse its .venv.
      - name: Smoke test
        run: python scripts/smoke-test ${{ inputs.visual && '--visual --data-dir ~/orchard-data' || '' }}
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ${{ matrix.tests }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Check that the committed dist/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo '::error::dist/ is out of date. Run npm run build and commit dist/.'
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ruff
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Lint and type check
        run: npm run lint

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the Python packages
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      # The test drives the page built from these sources, whether or not dist/ was rebuilt with them.
      - name: Build the page
        run: npm run build
      - name: Cache Playwright's browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: UI test
        run: npm run test:ui
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
